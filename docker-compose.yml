# AIPOS local Developer Control Center stack (dev placeholders only — NOT production)
# Prefer: npm run services:up
# Postgres-only legacy file: docker-compose.postgres.yml (kept for docs compatibility)

services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: aipos
      POSTGRES_PASSWORD: aipos_dev_only
      POSTGRES_DB: aipos
    volumes:
      - aipos_pg_data:/var/lib/postgresql/data
      - ./docker/postgres/init-test-db.sql:/docker-entrypoint-initdb.d/01-init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aipos -d aipos"]
      interval: 5s
      timeout: 5s
      retries: 10

  n8n:
    image: n8nio/n8n:1.107.4
    ports:
      - "5678:5678"
    environment:
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      NODE_ENV: development
      WEBHOOK_URL: http://localhost:5678/
      GENERIC_TIMEZONE: UTC
      # Dev-only encryption key placeholder — replace locally; never production secrets
      N8N_ENCRYPTION_KEY: aipos_dev_only_n8n_key_change_me
    volumes:
      - aipos_n8n_data:/home/node/.n8n
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:5678/healthz >/dev/null 2>&1 || wget -qO- http://127.0.0.1:5678/ >/dev/null 2>&1 || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  aipos_pg_data:
  aipos_n8n_data:
