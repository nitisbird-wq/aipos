name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # OSS Gitleaks CLI (pinned). Avoids gitleaks-action license requirement.
      - name: Install Gitleaks
        run: |
          set -euo pipefail
          VERSION="8.24.3"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks version

      - name: Scan commits in range (redacted)
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # fetch-depth: 0 fetches all remote refs; unrestricted gitleaks then flags
          # unrelated feature-branch history (false positives / unmerged fixtures).
          # Scope the scan to commits introduced by this event only.
          if [ "${EVENT_NAME}" = "pull_request" ]; then
            LOG_OPTS="${PR_BASE}..${PR_HEAD}"
          elif [ "${EVENT_NAME}" = "push" ] && [ -n "${BEFORE}" ] && [ "${BEFORE}" != "0000000000000000000000000000000000000000" ]; then
            LOG_OPTS="${BEFORE}..${SHA}"
          else
            # workflow_dispatch / first push: scan the tip commit only
            LOG_OPTS="-1 ${SHA}"
          fi
          echo "gitleaks log-opts: ${LOG_OPTS}"
          ./gitleaks detect --source . --verbose --redact --exit-code 1 --log-opts "${LOG_OPTS}"

  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: secrets
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aipos
          POSTGRES_PASSWORD: aipos_dev_only
          POSTGRES_DB: aipos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aipos -d aipos_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # CI-only local Postgres (not production). Enables repository contract + PG adapter tests.
      AIPOS_TEST_DATABASE_URL: postgresql://aipos:aipos_dev_only@localhost:5432/aipos_test
      AIPOS_RUN_PG_TESTS: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      # Include optional native bindings (e.g. @tailwindcss/oxide-linux-*).
      # npm has a known bug omitting optional deps across platforms from incomplete lockfiles.
      - name: Install
        run: npm ci --include=optional

      - name: Verify Tailwind Oxide binding
        working-directory: apps/web
        run: |
          set -euo pipefail
          npm ls @tailwindcss/oxide
          node -e "require('@tailwindcss/oxide'); console.log('oxide native binding ok')"
          case "$(uname -s)-$(uname -m)" in
            Linux-x86_64)
              npm ls @tailwindcss/oxide-linux-x64-gnu || npm ls @tailwindcss/oxide-linux-x64-musl
              ;;
          esac

      - name: Migrate test database
        run: npm run db:migrate -w web
        env:
          DATABASE_URL: postgresql://aipos:aipos_dev_only@localhost:5432/aipos_test

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      # Critical findings → exit 2; High (non-soft) → exit 1 under --profile pr
      # Soft High (e.g. Branch protection) does not fail PR profile.
      # Git remote passes on Actions checkouts that include origin.
      - name: AIPOS Doctor (PR profile)
        run: npm run aipos -- doctor --profile pr

      # Block Critical advisories only. High/Moderate tracked via Dependabot.
      # Do not use npm audit fix --force in CI.
      - name: Dependency audit (critical)
        run: npm audit --audit-level=critical

      - name: Dependency audit report (high, advisory)
        run: npm audit --audit-level=high
        continue-on-error: true
